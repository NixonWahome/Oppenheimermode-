[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
version = "0.1.0"
description = "AI-powered network intrusion detection with automated response and SIEM logging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
live = ["scapy>=2.5", "elasticsearch>=8.0"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
netsentinel-train = "netsentinel.train:main"
netsentinel-detect = "netsentinel.realtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
